<title>Hashyard</title>
<style>
/* ==========================================================================
   Hashyard — design tokens.

   The bare :root block carries the COMPLETE light palette. The two blocks
   after it redefine only tokens, never components, so no colour can end up
   with its single definition behind a media query — that is the classic
   unreadable-in-one-theme bug. Three states matter: an explicit choice stamps
   data-theme on <html>; the default "system" stamps nothing, so only
   prefers-color-scheme separates light from dark.
   ========================================================================== */
:root {
  --bg:        #EDEDEB;
  --panel:     #FFFFFF;
  --panel-2:   #F5F5F3;
  --ink:       #16181A;
  --ink-2:     #565C62;
  --ink-3:     #868C93;
  --line:      #DCDBD6;
  --line-2:    #E7E6E2;
  --accent:    #B4560B;
  --accent-lift:#C9620D;
  --accent-dim:#FAEFE3;
  --ok:        #12836B;
  --ok-dim:    #E2F0EB;
  --neg:       #B0416A;
  --neg-dim:   #FBEEF2;
  --neg-line:  #F0D5DE;
  --info-line: #EFD9BF;
  --info-ink:  #8A4A08;
  --hilite:    rgba(255,255,255,.95);
  --elev:      0 1px 2px rgba(22,24,26,.05), 0 10px 24px -16px rgba(22,24,26,.16);
  --card:      linear-gradient(180deg,#FFFFFF 0%,#FCFCFB 100%);
  --media-bg:  linear-gradient(168deg,#F8F8F6 0%,#EBEAE7 100%);
  --btn:       linear-gradient(180deg,#C9620D 0%,#AE5209 100%);
  --btn-glow:  0 6px 18px -8px rgba(180,86,11,.5);
  --track:     #E4E2DE;
  --bar:       #CFCCC6;
  --prop-cost: #B6B3AC;
  --prop-fee:  #DBD9D4;
  --tip-bg:    #16181A;
  --tip-ink:   #F2F2F0;
  --ambient:   rgba(180,86,11,.10);

  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:    "Barlow", "Helvetica Neue", Arial, sans-serif;
  --f-mono:    "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0B0E11;
    --panel:     #15191E;
    --panel-2:   #1C232A;
    --ink:       #E4E8EC;
    --ink-2:     #94A0AC;
    --ink-3:     #616D79;
    --line:      #28313A;
    --line-2:    #1E252B;
    --accent:    #E06B0D;
    --accent-lift:#F08420;
    --accent-dim:#2A1B0C;
    --ok:        #1FA98B;
    --ok-dim:    #0E2822;
    --neg:       #D2557E;
    --neg-dim:   #241A21;
    --neg-line:  #402933;
    --info-line: #4A3418;
    --info-ink:  #EFC79B;
    --hilite:    rgba(255,255,255,.055);
    --elev:      0 12px 30px -20px rgba(0,0,0,.8);
    --card:      linear-gradient(180deg,#181D23 0%,#13171C 100%);
    --media-bg:  linear-gradient(168deg,#1F262D 0%,#12171C 100%);
    --btn:       linear-gradient(180deg,#F08420 0%,#D9660B 100%);
    --btn-glow:  0 8px 22px -10px rgba(224,107,13,.62);
    --track:     #232B33;
    --bar:       #39414A;
    --prop-cost: #39434D;
    --prop-fee:  #242C34;
    --tip-bg:    #000;
    --tip-ink:   #E4E8EC;
    --ambient:   rgba(224,107,13,.14);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg:        #0B0E11;
  --panel:     #15191E;
  --panel-2:   #1C232A;
  --ink:       #E4E8EC;
  --ink-2:     #94A0AC;
  --ink-3:     #616D79;
  --line:      #28313A;
  --line-2:    #1E252B;
  --accent:    #E06B0D;
  --accent-lift:#F08420;
  --accent-dim:#2A1B0C;
  --ok:        #1FA98B;
  --ok-dim:    #0E2822;
  --neg:       #D2557E;
  --neg-dim:   #241A21;
  --neg-line:  #402933;
  --info-line: #4A3418;
  --info-ink:  #EFC79B;
  --hilite:    rgba(255,255,255,.055);
  --elev:      0 12px 30px -20px rgba(0,0,0,.8);
  --card:      linear-gradient(180deg,#181D23 0%,#13171C 100%);
  --media-bg:  linear-gradient(168deg,#1F262D 0%,#12171C 100%);
  --btn:       linear-gradient(180deg,#F08420 0%,#D9660B 100%);
  --btn-glow:  0 8px 22px -10px rgba(224,107,13,.62);
  --track:     #232B33;
  --bar:       #39414A;
  --prop-cost: #39434D;
  --prop-fee:  #242C34;
  --tip-bg:    #000;
  --tip-ink:   #E4E8EC;
  --ambient:   rgba(224,107,13,.14);
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { overflow-x: clip; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.025em; }
h1 { font-size: clamp(26px, 3.4vw, 40px); font-weight: 800; line-height: 1.05; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
select, button { font-family: inherit; }

.shell { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
.page { padding: 34px 0 64px; display: flex; flex-direction: column; gap: 26px; }
.page.narrow { max-width: 760px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.gap-sm { gap: 7px; }
.stack.end { align-items: flex-end; }
.stack.center { align-items: center; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.row.gap { justify-content: flex-start; gap: 10px; flex-wrap: wrap; }
.wide-row { width: 100%; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--ink-2); }
.small { font-size: 12.5px; line-height: 1.55; }
.accent { color: var(--accent-lift); }
.ok { color: var(--ok); }
.neg { color: var(--neg); }
.right { text-align: right; }
.rule { height: 1px; background: var(--line-2); border: 0; margin: 4px 0; }
.eyebrow {
  font-family: var(--f-mono); font-size: 10px; font-weight: 500; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-3);
}
.section-head { margin-top: 8px; }
.note-line { color: var(--ink-2); font-size: 13.5px; max-width: 78ch; }

/* ---------- header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-2);
}
.header-inner { display: flex; align-items: center; gap: 20px; height: 64px; }
.brand {
  display: flex; align-items: center; gap: 9px; background: none; border: 0; cursor: pointer;
  color: var(--ink); font-family: var(--f-display); font-weight: 800; font-size: 17px;
  letter-spacing: .015em; padding: 0;
}
.brand svg { width: 24px; height: 24px; }
.brand em { font-style: normal; color: var(--accent); }
.site-nav { display: flex; gap: 2px; margin-left: 8px; flex: 1; }
.site-nav button {
  background: none; border: 0; cursor: pointer; padding: 7px 12px; border-radius: 9px;
  color: var(--ink-2); font-size: 14px; font-weight: 500;
}
.site-nav button:hover { color: var(--ink); background: var(--panel-2); }
.site-nav button[aria-current="page"] { color: var(--accent-lift); background: var(--accent-dim); }
.header-right { display: flex; align-items: center; gap: 12px; }
.balance-chip {
  display: flex; flex-direction: column; align-items: flex-end; gap: 0;
  background: var(--card); border: 1px solid var(--line-2); border-radius: 11px;
  padding: 5px 11px; cursor: pointer; color: var(--ink); box-shadow: inset 0 1px 0 var(--hilite);
}
.balance-chip .k { font-family: var(--f-mono); font-size: 9px; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-3); }
.balance-chip .v { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.themer {
  display: inline-flex; gap: 2px; padding: 3px; background: var(--panel-2);
  border: 1px solid var(--line-2); border-radius: 10px;
}
.themer button {
  width: 28px; height: 26px; border: 0; border-radius: 7px; background: none; cursor: pointer;
  color: var(--ink-3); display: grid; place-items: center;
}
.themer button svg { width: 14px; height: 14px; }
.themer button:hover { color: var(--ink-2); }
.themer button[aria-pressed="true"] { background: var(--panel); color: var(--accent-lift); }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--panel-2); border: 1px solid var(--line); font-family: var(--f-mono);
  font-size: 12px; color: var(--ink-2); flex: none;
}
.avatar.sm { width: 24px; height: 24px; font-size: 10px; display: inline-grid; vertical-align: -7px; margin-right: 7px; }

/* ---------- hero ---------- */
.hero {
  position: relative; padding: 40px 0 8px;
}
.hero::before {
  content: ''; position: absolute; inset: -20% 0 20% 0;
  background: radial-gradient(70% 60% at 26% 40%, var(--ambient), transparent 72%);
  pointer-events: none;
}
.hero-copy { position: relative; max-width: 62ch; display: flex; flex-direction: column; gap: 14px; }
.hero-copy h1 { font-size: clamp(32px, 5vw, 56px); letter-spacing: -.035em; }
.hero-copy p { color: var(--ink-2); font-size: 16px; max-width: 60ch; }
.hero-stats { display: flex; gap: 34px; margin-top: 8px; flex-wrap: wrap; }
.hero-stats .n { font-family: var(--f-mono); font-size: 24px; display: block; }
.hero-stats .l { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }

/* ---------- panels, tiles ---------- */
.panel {
  background: var(--card); border: 1px solid var(--line-2); border-radius: 16px; padding: 18px;
  box-shadow: inset 0 1px 0 var(--hilite), var(--elev);
  display: flex; flex-direction: column; gap: 14px;
}
.grid { display: grid; gap: 14px; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.tiles.two { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.tile {
  background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 15px;
  box-shadow: inset 0 1px 0 var(--hilite); display: flex; flex-direction: column; gap: 3px;
}
.tile-value { font-family: var(--f-mono); font-size: 25px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tile-value small { font-size: 13px; color: var(--ink-2); }
.tile-value.accent { color: var(--accent-lift); }
.tile-value.ok { color: var(--ok); }
.tile-value.warn { color: var(--accent-lift); }
.tile-sub { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.split-2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }

/* ---------- machines ---------- */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.seg {
  display: inline-flex; gap: 3px; padding: 3px; background: var(--card);
  border: 1px solid var(--line-2); border-radius: 12px; box-shadow: inset 0 1px 0 var(--hilite);
}
.seg.wide { display: flex; }
.seg.wide button { flex: 1; }
.seg button {
  border: 0; border-radius: 9px; background: none; cursor: pointer; padding: 7px 15px;
  color: var(--ink-3); font-size: 13px; font-weight: 500;
}
.seg button:hover { color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); }
.seg button b { font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; color: var(--ink-3); margin-left: 5px; }
.sorter { display: flex; align-items: center; gap: 8px; }
.sorter select {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px;
  color: var(--ink); font-size: 13px;
}
.machines-grid { grid-template-columns: repeat(auto-fill, minmax(288px, 1fr)); }
.machine-card {
  display: flex; flex-direction: column; gap: 12px; text-align: left; cursor: pointer;
  background: var(--card); border: 1px solid var(--line-2); border-radius: 16px; padding: 15px;
  box-shadow: inset 0 1px 0 var(--hilite), var(--elev); color: var(--ink);
  transition: transform .14s, border-color .14s;
}
.machine-card:hover { transform: translateY(-2px); border-color: var(--line); }
.card-top { align-items: flex-start; }
.media {
  background: var(--media-bg); border: 1px solid var(--line-2); border-radius: 12px; padding: 8px;
  box-shadow: inset 0 1px 0 var(--hilite);
}
.media svg { width: 100%; height: auto; display: block; }
.media.large { padding: 22px; }
.media.thumb { width: 108px; flex: none; padding: 6px; }
.card-specs, .specs { display: grid; margin: 0; }
.card-specs { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card-specs div { display: flex; flex-direction: column; gap: 1px; }
.card-specs dt, .specs dt {
  font-family: var(--f-mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
}
.card-specs dd, .specs dd {
  margin: 0; font-family: var(--f-mono); font-size: 13.5px; font-variant-numeric: tabular-nums;
}
.card-specs dd small, .specs dd small { font-size: 10.5px; color: var(--ink-2); margin-left: 2px; }
.specs {
  grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line-2);
  border: 1px solid var(--line-2); border-radius: 14px; overflow: hidden; box-shadow: var(--elev);
}
.specs.four { grid-template-columns: repeat(4, 1fr); }
.specs > div { background: var(--panel); padding: 11px 13px; display: flex; flex-direction: column; gap: 2px; }
.specs dd { font-size: 15px; }
.card-foot { align-items: flex-end; }

/* the card answers cost / earnings / payback, and nothing else */
.card-money {
  display: flex; flex-direction: column; gap: 7px;
  padding: 12px 0 0; border-top: 1px solid var(--line-2);
}
.card-money .k { color: var(--ink-2); font-size: 13.5px; }
.card-money .v { font-family: var(--f-mono); font-size: 17px; font-variant-numeric: tabular-nums; }
.card-money .v small { font-size: 11px; color: var(--ink-2); }
.card-money .v.earn { color: var(--accent-lift); }
.card-money .v.neg { color: var(--neg); font-size: 14px; }
.card-note {
  font-size: 12.5px; color: var(--ink-2); line-height: 1.45;
  padding-top: 10px; border-top: 1px solid var(--line-2);
}
.card-note b { color: var(--ink); font-weight: 600; }

/* ------------------------------------------------------------ plan chooser */
.plan-option {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; width: 100%;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 13px 15px; cursor: pointer; color: var(--ink); text-align: left;
}
.plan-option:hover { border-color: var(--ink-3); }
.plan-option[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-dim); }
.plan-head { display: flex; flex-direction: column; gap: 1px; }
.plan-name { font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.plan-keep { font-size: 12.5px; color: var(--ink-2); }
.plan-numbers { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.plan-price { font-family: var(--f-mono); font-size: 16px; font-variant-numeric: tabular-nums; }
.plan-price small { font-size: 10px; color: var(--ink-3); }
.plan-monthly { font-family: var(--f-mono); font-size: 12.5px; color: var(--accent-lift); }
.plan-blurb { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }
.price { font-family: var(--f-mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.price small { font-size: 11px; color: var(--ink-2); }
.yield { font-family: var(--f-mono); font-size: 17px; color: var(--accent-lift); font-variant-numeric: tabular-nums; }
.yield.neg { color: var(--neg); font-size: 15px; }

/* ---------- detail ---------- */
.detail { display: grid; grid-template-columns: 1.5fr 1fr; gap: 22px; align-items: start; }
.detail-main { display: flex; flex-direction: column; gap: 18px; }
.detail-side { position: sticky; top: 88px; }
.buy-panel { gap: 16px; }
.big-price { font-family: var(--f-mono); font-size: 34px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.big-price small { font-size: 15px; color: var(--ink-2); }
.big-price.accent { color: var(--accent-lift); }
.lede { color: var(--ink-2); font-size: 15px; }
.crumb {
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink-2);
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .04em; align-self: flex-start;
}
.crumb:hover { color: var(--accent-lift); }

.split-option {
  display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px;
  cursor: pointer; color: var(--ink); text-align: left; width: 100%;
}
.split-option:hover { border-color: var(--ink-3); }
.split-option[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-dim); }
.split-option .t { font-family: var(--f-display); font-weight: 700; font-size: 14.5px; }
.split-option .n { grid-row: 1 / 3; font-family: var(--f-mono); font-size: 16px; color: var(--accent-lift); text-align: right; }
.split-option .n small { font-size: 10px; color: var(--ink-3); }
.split-option .s { grid-column: 1; color: var(--ink-2); font-size: 12.5px; }

/* ---------- ledger, bars ---------- */
.ledger-row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
.ledger-row .k { color: var(--ink-2); font-size: 13.5px; }
.ledger-row .v { font-family: var(--f-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ledger-row.total .k { color: var(--ink); font-weight: 600; font-family: var(--f-display); }
.ledger-row.total .v { color: var(--accent-lift); font-size: 16px; font-weight: 600; }
.prop { display: flex; height: 8px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--bg); }
.prop i { display: block; height: 100%; }
.prop .yours { background: var(--accent); }
.prop .cost { background: var(--prop-cost); }
.prop .fee { background: var(--prop-fee); }
.frac { display: flex; align-items: center; gap: 9px; }
.frac .track { flex: 1; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.frac .track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.frac .lbl { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }

/* ---------- chart ---------- */
.chart-block { display: flex; flex-direction: column; }
.chart { display: flex; align-items: flex-end; gap: 6px; height: 130px; padding-top: 20px; }
.chart-col {
  flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%;
  background: none; border: 0; padding: 0; cursor: pointer; position: relative;
}
.chart-bar { width: 100%; background: var(--bar); border-radius: 5px 5px 0 0; min-height: 3px; transition: background .12s; }
.chart-col.is-today .chart-bar { background: var(--accent); }
.chart-col:hover .chart-bar, .chart-col:focus-visible .chart-bar { background: var(--accent-lift); }
/* SLA top-up: the same hue, lighter — a second colour would be a categorical
   palette, which has to survive CVD separation for a distinction this small. */
.chart-topup { display: block; width: 100%; background: var(--accent); opacity: .45; border-radius: 5px 5px 0 0; box-shadow: 0 2px 0 0 var(--panel); }
.chart-tip {
  position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%);
  background: var(--tip-bg); color: var(--tip-ink); border-radius: 8px; padding: 5px 9px;
  font-family: var(--f-mono); font-size: 11px; white-space: nowrap; z-index: 4;
}
.chart-tip em { font-style: normal; color: var(--ink-3); }
.chart-axis { display: flex; gap: 6px; margin-top: 8px; }
.chart-axis span {
  flex: 1; text-align: center; font-family: var(--f-mono); font-size: 10px;
  letter-spacing: .05em; color: var(--ink-3); text-transform: uppercase;
}
.chart-axis span.is-today { color: var(--accent-lift); }
.chart-foot { margin-top: 10px; }

/* ---------- misc ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 23px; padding: 0 9px; border-radius: 7px;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
}
.pill.run { background: var(--ok-dim); color: var(--ok); }
.pill.hot { background: var(--accent-dim); color: var(--accent-lift); }
.pill.mute { background: var(--panel-2); color: var(--ink-2); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
@media (prefers-reduced-motion: no-preference) {
  .pill.run .dot { animation: pulse 2.4s ease-in-out infinite; }
}

/** Gross USD a machine mines in a day at the given hashprice. */
function grossPerDay(rig, cfg = CONFIG) {
  if (rig.algo === 'SHA-256') return (rig.hash / 1000) * cfg.btcHashprice;
  if (rig.algo === 'kHeavyHash') return rig.hash * cfg.kasHashprice;
  return rig.hash * cfg.ltcHashprice; // Scrypt
}

/** A machine's steady-state day at a given owner split. */
function econ(rig, share, cfg = CONFIG) {
  const gross = grossPerDay(rig, cfg);
  const power = (rig.watts / 1000) * 24 * cfg.powerRate;
  const net = gross - power;
  const you = net * share;
  return {
    gross,
    power,
    net,
    you,
    fee: net * (1 - share),
    dailyPct: (you / rig.price) * 100,
    apr: (you / rig.price) * 365 * 100,
    payback: Math.round(rig.price / you),
    viable: you > 0
  };
}

/**
 * One dated day of settlement.

 * Two things move independently: `hp`, the hashprice that day, and `up`, the
 * fraction of the day the machine actually hashed. Only `up` is guaranteed - a
 * shortfall is topped up to what SLA uptime would have earned AT THAT DAY'S
 * hashprice, which keeps the liability bounded and leaves price risk with the
 * owner.
 */
function dayEcon(day, rig, share, cfg = CONFIG) {
  const base = econ(rig, share, cfg);
  const gross = base.gross * day.hp * day.up;
  const power = base.power * day.up; // a stopped machine draws nothing
  const net = gross - power;
  const earned = net * share;
  const fullNet = base.gross * day.hp - base.power;
  const floor = fullNet * share * cfg.uptimeSLA;
  const credit = Math.max(0, floor - earned);
  return {
    ...day,
    gross,
    power,
    net,
    earned,
    credit,
    fee: net * (1 - share),
    paid: earned + credit
  };
}

/* ===== src/state/PlatformContext.jsx ===== */
/**
 * One store for both sides of the product.
 *
 * The admin panel edits `config`; every customer page derives its figures from
 * that same object, so a change to hashprice or the power tariff moves the
 * marketplace, the dashboard and the settlement page in the same render. That
 * is the whole point of keeping the economy in constants rather than scattering
 * numbers through the views.
 */
const PlatformContext = createContext(null);

function PlatformProvider({ children }) {
  const [config, setConfig] = useState(CONFIG);
  const [fleet, setFleet] = useState(SEED_FLEET);
  const [withdrawals, setWithdrawals] = useState(SEED_WITHDRAWALS);
  const [users] = useState(SEED_USERS);
  const [orders] = useState(SEED_ORDERS);

  // Recomputed only when the config actually moves.
  const account = useMemo(() => buildAccount(config), [config]);

  const setConfigValue = useCallback((key, value) => {
    setConfig((c) => ({ ...c, [key]: value }));
  }, []);

  const resetConfig = useCallback(() => setConfig(CONFIG), []);

  const decideWithdrawal = useCallback((id, status) => {
    setWithdrawals((ws) => ws.map((w) => (w.id === id ? { ...w, status } : w)));
  }, []);

  const toggleRig = useCallback((sn) => {
    setFleet((f) =>
      f.map((r) => (r.sn === sn ? { ...r, online: !r.online, temp: r.online ? 0 : 62 } : r))
    );
  }, []);

  const value = useMemo(
    () => ({
      config, setConfigValue, resetConfig,
      dirty: Object.keys(CONFIG).some((k) => CONFIG[k] !== config[k]),
      ...account,
      fleet, toggleRig,
      withdrawals, decideWithdrawal,
      users, orders
    }),
    [config, account, fleet, withdrawals, users, orders,
     setConfigValue, resetConfig, decideWithdrawal, toggleRig]
  );

  return <PlatformContext.Provider value={value}>{children}</PlatformContext.Provider>;
}

function usePlatform() {
  const ctx = useContext(PlatformContext);
  if (!ctx) throw new Error('usePlatform must be used inside <PlatformProvider>');
  return ctx;
}

/* ===== src/lib/useRouter.js ===== */
/**
 * Hash routing, deliberately dependency-free.
 *
 * A marketplace needs shareable URLs - #/machines/s21pro has to survive a
 * reload and a paste into chat - but react-router is a lot of surface for
 * seven routes. Swap this for react-router-dom the day you need nested
 * layouts or loaders; every caller only uses `route` and `go`.
 */
const parse = () => {
  const raw = window.location.hash.replace(/^#\/?/, '');
  const [path, query] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  return {
    page: parts[0] || 'machines',
    param: parts[1] || null,
    query: Object.fromEntries(new URLSearchParams(query || ''))
  };
};

function useRouter() {
  const [route, setRoute] = useState(parse);

  useEffect(() => {
    const onHash = () => setRoute(parse());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const go = useCallback((page, param) => {
    window.location.hash = '#/' + page + (param ? '/' + param : '');
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }, []);

  return { route, go };
}

/* ===== src/lib/useTheme.js ===== */
const KEY = 'hy-theme';

const read = () => {
  try {
    return localStorage.getItem(KEY) || 'system';
  } catch {
    return 'system'; // private mode - session only
  }
};

/**
 * Three states, not two. An explicit choice stamps data-theme on <html>;
 * "system" removes the stamp so prefers-color-scheme decides. Every colour in
 * styles.css is a token defined for all three states.
 */
function useTheme() {
  const [theme, setTheme] = useState(read);

  useEffect(() => {
    const root = document.documentElement;
    if (theme === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', theme);
    try {
      localStorage.setItem(KEY, theme);
    } catch {
      /* ignore */
    }
  }, [theme]);

  const resolved =
    theme !== 'system'
      ? theme
      : window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light';

  return { theme, setTheme, resolved };
}

/**
 * Seven days of payout, one series.
 *
 * A day that drew an SLA credit is drawn as two steps of the SAME hue rather
 * than two colours: a second colour here would be a categorical palette, and
 * a categorical palette needs to survive colour-blind separation checks for a
 * distinction this small. Same hue, different lightness, plus a marked label
 * and a tooltip, carries it without that cost.
 */
function PayoutChart({ series, onPickDay }) {
  const { config } = usePlatform();
  const [hover, setHover] = useState(null);
  const max = Math.max(...series.map((s) => s.paid));
  const credited = series.reduce((a, b) => a + b.credit, 0);

  return (
    <div className="chart-block">
      <div className="chart" role="img"
        aria-label={`Daily payout over seven days, ${money(series[0].paid)} to ${money(series[6].paid)} ${config.ticker}`}>
        {series.map((s, i) => (
          <button key={s.d} className={'chart-col' + (i === 6 ? ' is-today' : '')}
            onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}
            onFocus={() => setHover(i)} onBlur={() => setHover(null)}
            onClick={() => onPickDay && onPickDay(i)}
            aria-label={`${s.d}: ${money(s.paid)}${s.credit ? `, includes ${money(s.credit)} uptime credit` : ''}`}>
            {hover === i && (
              <span className="chart-tip">
                {s.d} · {money(s.paid)}
                {s.credit > 0 && <em> incl. {money(s.credit)} credit</em>}
              </span>
            )}
            <span className="chart-bar" style={{ height: `${(s.paid / max) * 100}%` }}>
              {s.credit > 0 && (
                <span className="chart-topup" style={{ height: `${(s.credit / s.paid) * 100}%` }} />
              )}
            </span>
          </button>
        ))}
      </div>

      <div className="chart-axis">
        {series.map((s, i) => (
          <span key={s.d} className={i === 6 ? 'is-today' : undefined}>
            {s.credit > 0 ? '◦ ' : ''}{i === 6 ? 'Today' : s.d}
          </span>
        ))}
      </div>

      {credited > 0 && (
        <div className="row chart-foot">
          <span className="eyebrow">{'◦'} Uptime credit applied</span>
          <span className="mono dim">+{money(credited)} this week</span>
        </div>
      )}
    </div>
  );
}

/**
 * Two plans, and the trade between them is a real one: Pro costs more to buy
 * and pays more every month. If both cost the same, nobody would ever choose
 * Standard and the control would be theatre - so each option carries its own
 * price, its own monthly earnings, and how long the extra takes to come back.
 */
function SplitSelector({ rig, value, onChange }) {
  const { config } = usePlatform();

  const build = (share, name, blurb) => {
    const e = econ(rig, share, config);
    return { share, name, blurb, price: priceFor(rig, share, config), monthly: e.you * 30.44 };
  };

  const std = build(config.splitStandard, 'Standard', 'Costs less to start.');
  const pro = build(config.splitPro, 'Pro', 'Costs more, pays more every month.');

  const extraCost = pro.price - std.price;
  const extraMonthly = pro.monthly - std.monthly;
  const breakEven = extraMonthly > 0 ? Math.round(extraCost / extraMonthly) : null;

  return (
    <div className="stack gap-sm">
      <span className="eyebrow">Choose your plan</span>

      {[std, pro].map((o) => (
        <button key={o.name} className="plan-option"
          aria-pressed={value === o.share} onClick={() => onChange(o.share)}>
          <span className="plan-head">
            <span className="plan-name">{o.name}</span>
            <span className="plan-keep">You keep {Math.round(o.share * 100)}%</span>
          </span>
          <span className="plan-numbers">

            <span className="plan-monthly">{money(o.monthly)} / month</span>

      ))}

      {breakEven && (

}

/**

 * minus fee, equals payout. The proportion bar underneath is accent-vs-neutral
 * on purpose - it encodes magnitude, not three separate identities.

  const { config } = usePlatform();
  const kwh = (rig.watts / 1000) * 24;
  return (

        v={`− ${money(e.power)}`} tone="dim" />
      <Row k={`Platform fee · ${Math.round((1 - share) * 100)}% of net`}

const KIND_FILTERS = [

const SORTS = [

  ['yield', 'Daily net'],

function Machines({ go }) {
  const { config } = usePlatform();
  const [filter, setFilter] = useState('all');
  const [sort, setSort] = useState('price');

  const rigs = useMemo(() => {
    const list = RIGS.filter((r) => filter === 'all' || r.kind === filter);

      price: (r) => r.price,

      eff: (r) => (r.unit === 'TH/s' ? r.watts / r.hash : r.watts / (r.hash * 1000))

function Checkout({ id, split, setSplit, go }) {
  const { config } = usePlatform();
  const [done, setDone] = useState(false);
  const rig = byId(id);
  if (!rig) return null;

  const e = econ(rig, split, config);
  const price = priceFor(rig, split, config);
  const after = ME.balance - price;
  const short = after < 0;

  if (done) {
    return (
      <div className="page narrow">
        <div className="panel success">
          <span className="tick" aria-hidden="true">✓</span>
          <h1>{rig.kind === 'share' ? 'Share allocated' : 'Machine is yours'}</h1>

            {rig.model} · {Math.round(split * 100)}/{Math.round((1 - split) * 100)} split.
            {rig.kind === 'share' ? ' Your slice is already hashing.' : ' Racking begins now.'}
          </p>
          <dl className="specs two">
            <div><dt>Assigned unit</dt><dd>21P-9107-KZ</dd></div>
            <div><dt>Hosting site</dt><dd>{rig.site}</dd></div>
            <div><dt>Powered on</dt><dd>{rig.kind === 'share' ? 'Now' : 'Within 24 h'}</dd></div>
            <div><dt>First settlement</dt><dd>10 Sep, 00:07 UTC</dd></div>
          </dl>
          <div className="row gap">
            <button className="btn primary" onClick={() => go('dashboard')}>View my rigs</button>
            <button className="btn" onClick={() => go('machines')}>Buy another</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="page narrow">
      <button className="crumb" onClick={() => go('machine', rig.id)}>← Back to {rig.model}</button>
      <h1>Confirm purchase</h1>

      <div className="panel row gap">
        <div className="media thumb"><RigDrawing rig={rig} /></div>
        <div className="stack">
          <h3>{rig.model}</h3>
          <span className="mono dim small">{rig.hash} {rig.unit} · {rig.site}</span>
        </div>
      </div>

      <div className="panel">
        <SplitSelector rig={rig} value={split} onChange={setSplit} />
      </div>

      <div className="panel stack gap-sm">
        <div className="ledger-row">
          <span className="k">Machine, {Math.round(split * 100)}% plan</span>
          <span className="v">{money(price)}</span>
        </div>
        <div className="ledger-row"><span className="k">Racking &amp; setup</span><span className="v ok">Included</span></div>
        <div className="ledger-row"><span className="k">Hosting deposit</span><span className="v ok">None</span></div>
        <hr className="rule" />
        <div className="ledger-row total"><span className="k">Pay from balance</span><span className="v">{money(price)} {config.ticker}</span></div>
      </div>

      <div className="panel stack gap-sm">
        <div className="ledger-row"><span className="k">Balance now</span><span className="v">{money(ME.balance)}</span></div>
        <div className="ledger-row">
          <span className="k">Balance after</span>
          <span className={'v' + (short ? ' neg' : '')}>{money(after)}</span>
        </div>
      </div>

      {short ? (
        <>
          <div className="notice warn">
            <b>You are {money(Math.abs(after))} {config.ticker} short.</b> Deposit over {config.network} to
            cover the difference — machines are held for 30 minutes.
          </div>
          <div className="row gap">
            <button className="btn primary" onClick={() => go('wallet')}>
              Deposit {money(Math.abs(after))} {config.ticker}
            </button>
            <button className="btn" onClick={() => go('machines')}>Choose another</button>

          Confirm &amp; start hashing
        </button>

      <p className="small dim">
        Your unit is powered on within 24 hours and settles from its first full day.
        Payouts begin at {money(e.you)} {config.ticker}/day at today&apos;s hashprice.
      </p>
    </div>
  );
}

/** A placeholder mark, not a scannable code. Deterministic from the address. */
function QrMark({ seed }) {
  const N = 25;
  let h = 0;
  for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => ((h = (h * 1664525 + 1013904223) >>> 0) / 4294967296);
  const cells = [];
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const finder = (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
      if (!finder && rnd() > 0.5) cells.push([x, y]);
    }
  }
  const Finder = ({ x, y }) => (
    <g>
      <rect x={x * 4} y={y * 4} width={28} height={28} fill="#000" />
      <rect x={(x + 1) * 4} y={(y + 1) * 4} width={20} height={20} fill="#fff" />
      <rect x={(x + 2) * 4} y={(y + 2) * 4} width={12} height={12} fill="#000" />
    </g>
  );
  return (
    <svg className="qr" viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" fill="#fff" />
      {cells.map(([x, y]) => <rect key={`${x}-${y}`} x={x * 4} y={y * 4} width={4} height={4} fill="#000" />)}
      <Finder x={0} y={0} /><Finder x={N - 7} y={0} /><Finder x={0} y={N - 7} />
    </svg>
  );
}

/**
 * The operator's daily P&L, computed from the same functions the customer
 * pages use. Fee income and SLA liability come out of one model, so the
 * margin here can never disagree with what a customer is shown.
 */
function Overview({ go }) {
  const { config, fleet, withdrawals, users, orders } = usePlatform();

  const kpi = useMemo(() => {
    let hash = 0, watts = 0, gross = 0, power = 0, fee = 0, credit = 0, owed = 0;
    for (const unit of fleet) {
      const rig = byId(unit.rigId);
      if (!rig) continue;
      const share = unit.owner === 'pool' ? 1 : config.splitStandard;
      const day = dayEcon({ hp: 1, up: unit.online ? unit.uptime : 0 }, rig, share, config);
      hash += rig.unit === 'TH/s' ? rig.hash * (unit.online ? unit.uptime : 0) : 0;
      watts += unit.online ? rig.watts : 0;
      gross += day.gross;
      power += day.power;
      owed += day.paid;
      if (unit.owner !== 'pool') {
        fee += day.fee;
        credit += day.credit;
      }
    }
    return { hash, watts, gross, power, fee, credit, owed, margin: fee - credit };
  }, [fleet, config]);

  const pending = withdrawals.filter((w) => w.status === 'pending');
  const pendingValue = pending.reduce((a, b) => a + b.amount, 0);
  const down = fleet.filter((r) => !r.online);

  const tiles = [
    { l: 'Fleet hashrate', v: round(kpi.hash), u: 'TH/s', s: `${fleet.filter((f) => f.online).length} of ${fleet.length} online` },
    { l: 'Power draw', v: (kpi.watts / 1000).toFixed(1), u: 'kW', s: `${money((kpi.watts / 1000) * 24 * config.powerRate)} per day` },
    { l: 'Mined today', v: money(kpi.gross), u: config.ticker, s: `less ${money(kpi.power)} power` },
    { l: 'Owed to customers', v: money(kpi.owed), u: config.ticker, s: 'settles 00:07 UTC' },
    { l: 'Fee income', v: money(kpi.fee), u: config.ticker, s: `${Math.round((1 - config.splitStandard) * 100)}% of customer net`, tone: 'ok' },
    { l: 'SLA credits', v: money(kpi.credit), u: config.ticker, s: 'paid out of fee', tone: kpi.credit > 0 ? 'warn' : undefined },
    { l: 'Margin today', v: money(Math.abs(kpi.margin)), u: config.ticker, s: kpi.margin < 0 ? 'LOSS' : 'fee less credits', tone: kpi.margin < 0 ? 'neg' : 'ok' },
    { l: 'Withdrawals queued', v: pending.length, u: '', s: `${money(pendingValue)} ${config.ticker}`, tone: pending.length ? 'warn' : undefined }
  ];

  return (
    <div className="admin-page">
      <div className="page-head">
        <div>
          <span className="eyebrow">9 September 2026</span>
          <h1>Overview</h1>
        </div>
        <span className="pill run"><i className="dot" />Settlement healthy</span>
      </div>

      <div className="grid tiles">
        {tiles.map((t) => (
          <div className="tile" key={t.l}>
            <span className="eyebrow">{t.l}</span>
            <span className={'tile-value' + (t.tone ? ' ' + t.tone : '')}>
              {t.v}{t.u && <small> {t.u}</small>}
            </span>
            <span className="tile-sub">{t.s}</span>
          </div>
        ))}
      </div>

      {(down.length > 0 || pending.length > 0) && (
        <div className="admin-alerts">
          {down.map((r) => (
            <div className="notice warn" key={r.sn}>
              <b>{r.sn} is offline.</b> {byId(r.rigId)?.model} at {r.site}, {(r.uptime * 100).toFixed(1)}%
              uptime this week — below the {Math.round(config.uptimeSLA * 100)}% floor, so it is accruing
              SLA credits against your fee. <button className="linkish" onClick={() => go('admin-fleet')}>Open fleet</button>
            </div>
          ))}
          {pending.length > 0 && (
            <div className="notice info">
              <b>{pending.length} withdrawal{pending.length > 1 ? 's' : ''} waiting.</b>{' '}
              {money(pendingValue)} {config.ticker} total.{' '}
              <button className="linkish" onClick={() => go('admin-withdrawals')}>Review queue</button>
            </div>
          )}
        </div>
      )}

      <div className="split-2">

            </thead>

                const paying = fleet.filter((f) => f.owner !== 'pool').length;
                const one = dayEcon(d, rig, config.splitStandard, config);
                const f = one.fee * paying, c = one.credit * paying, m = f - c;
                return (
                  <tr key={d.d}>

          <p className="small dim">

                    <span className={'pill ' + (!u.online ? 'mute' : breaching ? 'hot' : 'run')}>
                      {!u.online ? 'Offline' : breaching ? 'Below SLA' : 'Hashing'}
                    </span>
                  </td>
                  <td className="right">
                    <button className="btn tiny" onClick={() => toggleRig(u.sn)}>
                      {u.online ? 'Stop' : 'Start'}
                    </button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="grid tiles">
        <div className="tile">
          <span className="eyebrow">Below SLA</span>
          <span className="tile-value warn">
            {fleet.filter((u) => u.uptime < config.uptimeSLA).length}
            <small> of {fleet.length}</small>
          </span>
          <span className="tile-sub">accruing credits against your fee</span>
        </div>
        <div className="tile">
          <span className="eyebrow">Customer-owned</span>
          <span className="tile-value">{fleet.filter((u) => u.owner !== 'pool').length}</span>
          <span className="tile-sub">the only units that generate fee</span>
        </div>
        <div className="tile">
          <span className="eyebrow">Hashyard-owned</span>
          <span className="tile-value">{fleet.filter((u) => u.owner === 'pool').length}</span>
          <span className="tile-sub">unsold stock, full output to you</span>
        </div>
        <div className="tile">
          <span className="eyebrow">Nameplate draw</span>
          <span className="tile-value">
            {round(fleet.reduce((a, u) => a + (byId(u.rigId)?.watts || 0), 0) / 1000)}<small> kW</small>
          </span>
          <span className="tile-sub">if every unit ran flat out</span>
        </div>
      </div>

      <p className="small dim">
        Stopping a unit here simulates an outage: its uptime stops counting, the customer&apos;s payout
        falls, and the SLA credit that covers the gap appears in the credit column — charged to your
        fee, not to them.
      </p>
    </div>
  );
}

/* ===== src/admin/Withdrawals.jsx ===== */
const TONE = { pending: 'hot', approved: 'run', sent: 'run', rejected: 'mute' };

function Withdrawals() {
  const { withdrawals, decideWithdrawal, config } = usePlatform();
  const pending = withdrawals.filter((w) => w.status === 'pending');
  const queued = pending.reduce((a, b) => a + b.amount, 0);

  return (
    <div className="admin-page">
      <div className="page-head">
        <div>
          <span className="eyebrow">{pending.length} awaiting a decision</span>
          <h1>Withdrawals</h1>
        </div>
        <span className={'pill ' + (pending.length ? 'hot' : 'run')}>
          {money(queued)} {config.ticker} queued
        </span>
      </div>

      <div className="notice info">
        <b>Approving sends real funds on {config.network}, and it cannot be undone.</b> Two things
        are worth checking before you click: that the customer&apos;s identity check has passed, and
        that the destination address matches one they have used before. Anything over{' '}
        {money(REVIEW_THRESHOLD)} {config.ticker} is held for a human on purpose.
      </div>

      <div className="panel">
        <table className="table">
          <thead>
            <tr>
              <th>Ref</th><th>Customer</th><th className="right">Amount</th>
              <th>Destination</th><th>Identity</th><th>Status</th><th className="right">Decision</th>
            </tr>
          </thead>
          <tbody>
            {withdrawals.map((w) => {
              const big = w.amount >= REVIEW_THRESHOLD;
              const blocked = w.kyc !== 'approved';
              return (
                <tr key={w.id}>
                  <td className="mono small">{w.id}<span className="dim"> · {w.when}</span></td>
                  <td>{w.user}</td>
                  <td className={'right mono ' + (big ? 'warn' : '')}>
                    {money(w.amount)}{big && <span className="dim small"> review</span>}
                  </td>
                  <td className="mono small dim">{w.address.slice(0, 6)}…{w.address.slice(-4)}</td>
                  <td>
                    <span className={'pill ' + (w.kyc === 'approved' ? 'run' : 'hot')}>{w.kyc}</span>
                  </td>
                  <td><span className={'pill ' + (TONE[w.status] || 'mute')}>{w.status}</span></td>
                  <td className="right">
                    {w.status === 'pending' ? (
                      <div className="row-actions">
                        <button className="btn tiny" onClick={() => decideWithdrawal(w.id, 'rejected')}>
                          Reject
                        </button>
                        <button className="btn tiny primary" disabled={blocked}
                          title={blocked ? 'Identity check has not passed' : undefined}
                          onClick={() => decideWithdrawal(w.id, 'approved')}>
                          Approve
                        </button>
                      </div>
                    ) : (
                      <span className="dim small">—</span>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="grid tiles">
        {['pending', 'approved', 'sent', 'rejected'].map((s) => (
          <div className="tile" key={s}>
            <span className="eyebrow">{s}</span>
            <span className="tile-value">{withdrawals.filter((w) => w.status === s).length}</span>
            <span className="tile-sub">
              {money(withdrawals.filter((w) => w.status === s).reduce((a, b) => a + b.amount, 0))} {config.ticker}
            </span>
          </div>
        ))}
      </div>

      <p className="small dim">
        The approve button is disabled while a customer&apos;s identity check is outstanding — that is
        a deliberate block, not a loading state. Jemal O.&apos;s request stays queued until their check
        clears.
      </p>
    </div>
  );
}

/* ===== src/admin/Customers.jsx ===== */
function Customers() {
  const { users, fleet, config, withdrawals } = usePlatform();

  const rowsFor = (name) => fleet.filter((f) => f.owner === name);

  return (
    <div className="admin-page">
      <div className="page-head">
        <div>
          <span className="eyebrow">{users.length} accounts</span>
          <h1>Customers</h1>
        </div>
      </div>

      <div className="panel">
        <table className="table">
          <thead>
            <tr>
              <th>Customer</th><th>Joined</th><th>Identity</th><th className="right">Balance</th>
              <th className="right">Machines</th><th className="right">Owed / day</th>
              <th className="right">Fee / day</th><th>Referred by</th>
            </tr>
          </thead>
          <tbody>
            {users.map((u) => {
              const owned = rowsFor(u.name);
              let owed = 0, fee = 0;
              for (const unit of owned) {
                const rig = byId(unit.rigId);
                if (!rig) continue;
                const d = dayEcon({ hp: 1, up: unit.online ? unit.uptime : 0 }, rig, config.splitStandard, config);
                owed += d.paid;
                fee += d.fee - d.credit;
              }
              return (
                <tr key={u.id}>
                  <td>
                    <span className="avatar sm">{u.name.split(' ').map((s) => s[0]).join('')}</span>
                    {u.name}<span className="dim small"> @{u.handle}</span>
                  </td>
                  <td className="small dim">{u.joined}</td>
                  <td>
                    <span className={'pill ' + (u.kyc === 'approved' ? 'run' : u.kyc === 'pending' ? 'hot' : 'mute')}>
                      {u.kyc}
                    </span>
                  </td>
                  <td className="right mono">{money(u.balance)}</td>
                  <td className="right mono">{owned.length}</td>
                  <td className="right mono">{money(owed)}</td>
                  <td className={'right mono ' + (fee < 0 ? 'neg' : 'ok')}>
                    {fee < 0 ? '−' : '+'}{money(Math.abs(fee))}
                  </td>
                  <td className="small dim">{u.referredBy ? '@' + u.referredBy : '—'}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="split-2">
        <section className="panel">
          <h2>Referral graph</h2>
          <p className="small dim">
            Every account except the first arrived through one referrer. That concentration is worth
            watching: a referral tree this narrow means your growth and your biggest fee-payer are
            the same person.
          </p>
          <ul className="tree">
            {users.filter((u) => !u.referredBy).map((root) => (
              <li key={root.id}>
                <b>{root.name}</b> <span className="dim small">@{root.handle}</span>
                <ul>
                  {users.filter((u) => u.referredBy === root.handle).map((child) => (
                    <li key={child.id}>
                      {child.name}
                      <span className="dim small"> · {rowsFor(child.name).length} machines · {child.kyc}</span>
                    </li>
                  ))}
                </ul>
              </li>
            ))}
          </ul>
        </section>

        <section className="panel">
          <h2>Identity checks</h2>
          <table className="table">
            <thead><tr><th>State</th><th className="right">Accounts</th><th className="right">Blocked payouts</th></tr></thead>
            <tbody>
              {['approved', 'pending', 'none'].map((k) => {
                const names = users.filter((u) => u.kyc === k).map((u) => u.name);
                const blocked = withdrawals.filter((w) => w.status === 'pending' && names.includes(w.user));
                return (
                  <tr key={k}>
                    <td><span className={'pill ' + (k === 'approved' ? 'run' : k === 'pending' ? 'hot' : 'mute')}>{k}</span></td>
                    <td className="right mono">{names.length}</td>
                    <td className="right mono">
                      {k === 'approved' ? '—' : blocked.length ? money(blocked.reduce((a, b) => a + b.amount, 0)) : '0.00'}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <p className="small dim">
            A withdrawal cannot be approved while its owner&apos;s check is outstanding. That is the
            one place in this console where the block is enforced rather than advisory.
          </p>
        </section>
      </div>
    </div>
  );
}

const CONTROLS = [
  { k: 'btcHashprice', label: 'BTC hashprice', unit: '$/PH·day', min: 15, max: 90, step: 0.1,
    help: 'What a petahash earns per day. Set by BTC price and network difficulty — you do not control it, but every figure on the site follows it.' },
  { k: 'powerRate', label: 'Power tariff', unit: '$/kWh', min: 0.02, max: 0.14, step: 0.001,
    help: 'Your all-in hosting cost. The single number that decides which machines are worth running.' },
  { k: 'splitStandard', label: 'Standard split', unit: 'to owner', min: 0.6, max: 0.95, step: 0.01, pct: true,
    help: 'The owner keeps this share of net revenue; you keep the rest. It also sets your SLA break-even.' },
  { k: 'splitPro', label: 'Pro split', unit: 'to owner', min: 0.7, max: 0.98, step: 0.01, pct: true,
    help: 'The 12-month tier. A higher number here halves the fee that funds your guarantee.' },
  { k: 'uptimeSLA', label: 'Uptime guarantee', unit: 'floor', min: 0.85, max: 0.999, step: 0.005, pct: true,
    help: 'Hash fewer hours than this and you credit the shortfall. Raising it raises your break-even uptime one-for-one.' },
  { k: 'referralShare', label: 'Referral share', unit: 'of your fee', min: 0, max: 0.3, step: 0.01, pct: true,
    help: 'Paid from the platform fee on a referred machine — never from their deposit.' },
  { k: 'firstDeposit', label: 'First-deposit credit', unit: 'of deposit', min: 0, max: 0.25, step: 0.01, pct: true,
    help: 'Hosting credit, not withdrawable cash. Capped at ' + CONFIG.firstDepCap + ' USDT.' }
];

function Pricing() {
  const { config, setConfigValue, resetConfig, dirty, fleet } = usePlatform();

  const sellable = RIGS.filter((r) => econ(r, config.splitStandard, config).viable);
  const underwater = RIGS.length - sellable.length;
  const paying = fleet.filter((f) => f.owner !== 'pool');

  const exposure = [config.splitStandard, config.splitPro].map((sp) => {
    const be = breakEvenUptime(sp, config);
    const thu = dayEcon(WEEK[3], byId('s21pro'), sp, config);
    const week = WEEK.reduce((a, d) => {
      const x = dayEcon(d, byId('s21pro'), sp, config);
      return a + x.fee - x.credit;
    }, 0);
    return { sp, be, thu, week, fleetWeek: week * paying.length };
  });

  return (
    <div className="admin-page">
      <div className="page-head">
        <div>
          <span className="eyebrow">Live — the customer site reads these values</span>
          <h1>Pricing &amp; risk</h1>
        </div>
        <button className="btn" onClick={resetConfig} disabled={!dirty}>
          {dirty ? 'Reset to shipped values' : 'At shipped values'}
        </button>
      </div>

      <div className="notice info">
        <b>These controls are wired, not decorative.</b> Move any slider and the marketplace,
        the machine pages, the dashboard and the settlement ledger all recompute — there is one
        source of truth for the economy, and this is it.
      </div>

      <div className="split-2">
        <section className="panel">
          <h2>Economy</h2>
          <div className="controls">
            {CONTROLS.map((c) => {
              const v = config[c.k];
              const changed = CONFIG[c.k] !== v;
              return (
                <div className="control" key={c.k}>
                  <div className="row">
                    <label htmlFor={'c-' + c.k}>
                      {c.label}
                      {changed && <em className="edited">edited</em>}
                    </label>
                    <span className="mono val">
                      {c.pct ? (v * 100).toFixed(c.step < 0.01 ? 1 : 0) + '%' : v.toFixed(c.step < 0.01 ? 3 : 2)}
                      <small> {c.unit}</small>
                    </span>
                  </div>
                  <input id={'c-' + c.k} type="range" min={c.min} max={c.max} step={c.step} value={v}
                    onChange={(e) => setConfigValue(c.k, parseFloat(e.target.value))} />
                  <p className="small dim">{c.help}</p>
                </div>
              );
            })}
          </div>
        </section>

        <div className="stack">
          <section className="panel">
            <h2>What the catalogue looks like now</h2>
            <div className="grid tiles">
              <div className="tile">
                <span className="eyebrow">Sellable</span>
                <span className="tile-value ok">{sellable.length}<small> of {RIGS.length}</small></span>
                <span className="tile-sub">net positive after power</span>
              </div>
              <div className="tile">
                <span className="eyebrow">Underwater</span>
                <span className={'tile-value ' + (underwater > 1 ? 'neg' : '')}>{underwater}</span>
                <span className="tile-sub">burn more than they mine</span>
              </div>
            </div>
            {underwater > 0 && (
              <div className="notice warn">
                <b>{underwater} machine{underwater > 1 ? "s are" : " is"} now underwater.</b> At ${config.powerRate.toFixed(3)}/kWh
                and ${config.btcHashprice.toFixed(2)}/PH·day these cannot be sold, and any already
                racked are costing their owners money every day:{' '}
                {RIGS.filter((r) => !econ(r, config.splitStandard, config).viable)
                  .map((r) => r.model).join(', ')}.
              </div>
            )}
            <table className="table">
              <thead><tr><th>Machine</th><th className="right">Owner / day</th><th className="right">Your fee</th></tr></thead>
              <tbody>
                {['sh-s21pro-14', 's21pro', 's21xph', 's19kpro'].map((id) => {
                  const r = byId(id);
                  const e = econ(r, config.splitStandard, config);
                  return (
                    <tr key={id}>
                      <td className="small">{r.model}</td>
                      <td className={'right mono ' + (e.viable ? '' : 'neg')}>
                        {e.viable ? '+' : '−'}{money(Math.abs(e.you))}
                      </td>
                      <td className={'right mono ' + (e.fee > 0 ? 'ok' : 'neg')}>
                        {e.fee > 0 ? '+' : '−'}{money(Math.abs(e.fee))}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </section>

          <section className="panel">
            <h2>Guarantee exposure</h2>
            <p className="small dim">
              SLA credits come out of your fee. Below <b>owner split × SLA</b> a machine costs more in
              credits than it earns you — the identity cancels hashprice, model and power cost, so
              these two numbers are the whole risk model.
            </p>
            <table className="table">
              <thead>
                <tr>
                  <th>Plan</th><th className="right">Break-even</th><th className="right">Thu margin</th>
                  <th className="right">Week, fleet</th>
                </tr>
              </thead>
              <tbody>
                {exposure.map((x) => {
                  const m = x.thu.fee - x.thu.credit;
                  return (
                    <tr key={x.sp}>
                      <td>{Math.round(x.sp * 100)}/{Math.round((1 - x.sp) * 100)}</td>
                      <td className="right mono warn">{(x.be * 100).toFixed(1)}%</td>
                      <td className={'right mono ' + (m < 0 ? 'neg' : 'ok')}>
                        {m < 0 ? '−' : '+'}{money(Math.abs(m))}
                      </td>
                      <td className={'right mono ' + (x.fleetWeek < 0 ? 'neg' : 'ok')}>
                        {x.fleetWeek < 0 ? '−' : '+'}{money(Math.abs(x.fleetWeek))}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {exposure[1].be > 0.9 && (
              <div className="notice warn">
                <b>The Pro tier is the exposed one.</b> At a {Math.round(config.splitPro * 100)}%
                owner split you need {(exposure[1].be * 100).toFixed(1)}% uptime just to break even on
                the guarantee, while collecting half the fee that funds it. Consider offering the
                guarantee on Standard only, or giving Pro a lower floor.
              </div>
            )}
          </section>
        </div>
      </div>
    </div>
  );
}

/* ===== src/App.jsx ===== */
const ADMIN = {
  admin: Overview,
  'admin-fleet': Fleet,
  'admin-withdrawals': Withdrawals,
  'admin-users': Customers,
  'admin-pricing': Pricing
};

function Site() {
  const { route, go } = useRouter();
  const { theme, setTheme } = useTheme();
  const { config, dirty } = usePlatform();

  // Purchase intent lives above the pages: the split is picked on the machine
  // page and must still be there at checkout.
  const [split, setSplit] = useState(config.splitStandard);
  const [day, setDay] = useState(3); // Thursday - the day the guarantee pays

  const openDay = (i) => { setDay(i); go('settlement'); };

  const AdminPage = ADMIN[route.page];
  if (AdminPage) {
    return (
      <AdminLayout page={route.page} go={go}>
        <AdminPage go={go} />
      </AdminLayout>
    );
  }

  let view;
  switch (route.page) {
    case 'machine':
      view = <MachineDetail id={route.param} split={split} setSplit={setSplit} go={go} />;
      break;
    case 'checkout':
      view = <Checkout id={route.param} split={split} setSplit={setSplit} go={go} />;
      break;
    case 'dashboard':
      view = <Dashboard go={go} onPickDay={openDay} />;
      break;
    case 'settlement':
      view = <Settlement day={day} setDay={setDay} />;
      break;
    case 'wallet':
      view = <Wallet />;
      break;
    case 'referrals':
      view = <Referrals />;
      break;
    default:
      view = <Machines go={go} />;
  }

  return (
    <>
      <Header page={route.page} go={go} theme={theme} setTheme={setTheme} />
      {dirty && (
        <div className="live-banner">
          Showing edited platform values from the operator console.
          <button onClick={() => go('admin-pricing')}>Open pricing</button>
        </div>
      )}
      <main className="shell">{view}</main>
      <footer className="site-footer">
        <div className="shell footer-inner">
          <span>Hashyard — prototype. No live wallet, no real funds.</span>
          <span className="mono">
            Hashprice ${config.btcHashprice.toFixed(2)}/PH·day · power ${config.powerRate.toFixed(3)}/kWh ·
            SLA {Math.round(config.uptimeSLA * 100)}%
          </span>
          <button className="linkish" onClick={() => go('admin')}>Operator console →</button>
        </div>
      </footer>
    </>
  );
}

function App() {
  return (
    <PlatformProvider>
      <Site />
    </PlatformProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

<script>
/* Babel-standalone is only needed for this preview build, and cdnjs version
   paths move. Try a few, and say something useful rather than showing a blank
   page if none of them load. */
(function () {
  var VERSIONS = ['7.26.4', '7.25.6', '7.24.7', '7.23.5'];
  var root = document.getElementById('root');

  function fail(why) {
    root.innerHTML =
      '<div class="boot-msg"><h1>Preview could not start</h1><p>' + why +
      '</p><p style="margin-top:10px">The project itself is unaffected — run ' +
      '<code>npm install &amp;&amp; npm run dev</code> in <code>hashyard-web/</code>, ' +
      'which uses Vite and needs none of this.</p></div>';
  }

  function run() {
    try {
      window.Babel.transformScriptTags();
    } catch (e) {
      fail('The preview bundle failed to compile: ' + e.message);
    }
  }

  function load(i) {
    if (i >= VERSIONS.length) return fail('The JSX compiler could not be loaded from the CDN.');
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/' + VERSIONS[i] + '/babel.min.js';
    s.onload = function () { window.Babel ? run() : load(i + 1); };
    s.onerror = function () { load(i + 1); };
    document.head.appendChild(s);
  }

  if (!window.React || !window.ReactDOM) return fail('React could not be loaded from the CDN.');
  load(0);
})();
</script>
